server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS。让 nginx 按 TTL 重新解析上游容器 IP，避免 api 容器
    # 重启换 IP 后 nginx 仍打旧 IP 导致长期 502（默认只在启动时解析一次并永久缓存）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # 用变量做 proxy_pass 目标，强制 nginx 在请求时经 resolver 重新解析，
        # 而非在配置加载时把 api 固化成某个 IP。$request_uri 原样透传（含 /api/ 前缀）。
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
